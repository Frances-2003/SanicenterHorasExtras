[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = ".netlify/functions-prepared"
  node_bundler = "esbuild"
  # Bundle Firebase Admin/Auth, including the CommonJS jwks-rsa -> ESM jose boundary.
  # Firestore stays external because its gRPC/protobuf resources must remain on disk.
  external_node_modules = ["@google-cloud/firestore", "@google-cloud/firestore-api"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# No secrets or production activation flags here. Nitro generates the SSR fallback.
